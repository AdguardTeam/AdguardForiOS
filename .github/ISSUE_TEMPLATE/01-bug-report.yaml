name: 🐞 Bug report
description: If you found something that we should know about
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!

  - type: checkboxes
    attributes:
      label: Please answer the following questions for yourself before submitting an issue
      options:
        - label: Filters were updated before reproducing an issue
          required: true
        - label: I checked the [knowledge base](https://adguard.com/kb/) and found no answer
          required: true
        - label: I checked to make sure that this issue has not already been filed
          required: true

  - type: input
    id: app_version
    attributes:
      label: AdGuard Version
      description: What version of AdGuard for iOS are you running?
      placeholder: For example, 4.5.22
    validations:
      required: true

  - type: textarea
    id: enviroment
    attributes:
      label: Environment
      description: |
        Examples:
          - **iOS/iPadOS version**: iOS 27.2
          - **Device**: iPhone 18 Pro Max
      value: |
          - iOS/iPadOS Version: 
          - Device: 
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        Select enabled filters if they are related to the application bug.
        If the issue is related to the filtering (missed ads, cookie, etc.)
        please use the [Web Reporting Tool](https://link.adtidy.org/forward.html?action=report&app=home&from=github).

  - type: dropdown
    id: filters_adblock
    attributes:
      label: Ad Blocking
      multiple: true
      options:
        - AdGuard Base filter
        - AdGuard Mobile Ads filter
        - EasyList
    validations:
      required: false

  - type: dropdown
    id: filters_privacy
    attributes:
      label: Privacy
      multiple: true
      options:
        - AdGuard Tracking Protection filter
        - AdGuard Mail Tracking Protection filter
        - EasyPrivacy
        - Block Outsider Intrusion into LAN
        - Peter Lowe's Blocklist
        - Fanboy's Anti-Facebook List
    validations:
      required: false

  - type: dropdown
    id: filters_social
    attributes:
      label: Social
      multiple: true
      options:
        - AdGuard Social Media filter
        - Fanboy's Social Blocking List
    validations:
      required: false

  - type: dropdown
    id: filters_annoyances
    attributes:
      label: Annoyances
      multiple: true
      options:
        - AdGuard Annoyances filter
        - AdGuard Cookie Notices filter
        - AdGuard Popups filter
        - AdGuard Mobile App Banners filter
        - AdGuard Other Annoyances filter
        - AdGuard Widgets filter
        - Adblock Warning Removal List
        - Fanboy's Annoyances
        - Web Annoyances Ultralist
        - EasyList Cookie List
        - Stevo's AI Blocklist
    validations:
      required: false

  - type: dropdown
    id: filters_security
    attributes:
      label: Security
      multiple: true
      options:
        - Phishing URL Blocklist
        - Scam Blocklist by DurableNapkin
        - uBlock Origin - Badware risks
        - Dandelion Sprout's Anti-Malware List
    validations:
      required: false

  - type: dropdown
    id: filters_other
    attributes:
      label: Other
      multiple: true
      options:
        - Filter unblocking search ads and self-promotion
        - AdGuard Experimental filter
        - Fanboy's Anti-thirdparty Fonts
    validations:
      required: false

  - type: dropdown
    id: filters_regional
    attributes:
      label: Language-specific
      multiple: true
      options:
        - AdGuard Russian filter
        - AdGuard German filter
        - AdGuard Japanese filter
        - AdGuard Dutch filter
        - AdGuard Spanish/Portuguese filter
        - AdGuard Turkish filter
        - AdGuard French filter
        - AdGuard Ukrainian filter
        - AdGuard Italian filter
        - AdGuard Polish filter
        - AdGuard Chinese filter
        - ABPindo
        - Bulgarian list
        - EasyList China
        - EasyList Czech and Slovak
        - EasyList Dutch
        - EasyList Germany
        - EasyList Hebrew
        - EasyList Italy
        - EasyList Lithuania
        - Latvian List
        - Liste AR
        - Liste FR
        - ROList
        - Icelandic ABP List
        - AdBlockID
        - Greek AdBlock Filter
        - EasyList Portuguese
        - EasyList Thailand
        - Hungarian filter
        - Xfiles
        - "RU AdList: Counters"
        - ABPVN List
        - Official Polish filters for AdBlock, uBlock Origin & AdGuard
        - Polish GDPR-Cookies Filters
        - Estonian List
        - CJX's Annoyances List
        - Polish Social Filters
        - filterslist-KO Classic filter list
        - xinggsf
        - EasyList Spanish
        - KAD - Anti-Scam
        - Adblock List for Finland
        - ROLIST2
        - Persian Blocker
        - road-block
        - Polish Annoyances Filters
        - Polish Anti Adblock Filters
        - Frellwit's Swedish Filter
        - YousList
        - EasyList Polish
        - Polish Anti-Annoying Special Supplement
        - Dandelion Sprout's Serbo-Croatian List
        - IndianList
        - Macedonian adBlock Filters
        - Dandelion Sprout's Nordic Filters
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: Advanced protection for Safari
      description: Do you have advanced protection enabled?
      options:
        - label: Yes, I do
    validations:
      required: false

  - type: dropdown
    id: dns_protection
    attributes:
      description: Which DNS server do you use? If you don't use DNS protection, select 'DNS protection disabled'.
      label: DNS Server
      multiple: false
      options:
        - DNS protection disabled
        - System default
        - AdGuard DNS
        - AdGuard DNS Family Protection
        - AdGuard DNS Non-filtering
        - Google DNS
        - Cloudflare DNS
        - Cloudflare for Families - Malware and Adult Content
        - Cloudflare for Families - Malware Blocking
        - Open DNS
        - Open DNS with Family Shield
        - Quad9
        - Custom DNS
    validations:
      required: true

  - type: dropdown
    id: dns_protocol
    attributes:
      description: What DNS protocol do you use? If you don't use DNS protection, select 'DNS protection disabled'.
      label: DNS Protocol
      multiple: false
      options:
        - DNS protection disabled
        - Regular
        - DNSCrypt
        - DNS-over-HTTPS
        - DNS-over-TLS
        - DNS-over-QUIC
    validations:
      required: true

  - type: textarea
    id: custom_dns
    attributes:
      label: Custom DNS
      description: Please provide a link to the custom DNS you use.
      placeholder: If you have selected a DNS server from the pre-defined list, skip this.
    validations:
      required: false

  - type: checkboxes
    id: dns_filter
    attributes:
      label: DNS Filtering
      description: Do you have AdGuard DNS filter enabled?
      options:
        - label: Yes, I do
          required: false

  - type: textarea
    id: custom_dns_filter
    attributes:
      label: Custom DNS Filter
      description: Please provide a link to the custom DNS filter you use.
      placeholder: If you don't use DNS protection, skip this.
    validations:
      required: false

  - type: dropdown
    id: dns_implementation
    attributes:
      label: DNS Implementation
      description: If you don't use DNS protection, skip this.
      multiple: false
      options:
        - AdGuard
        - Native
    validations:
      required: false

  - type: dropdown
    id: tunnel_mode
    attributes:
      label: Tunnel Mode
      description: If you don't use the in-app DNS implementation, skip this.
      multiple: false
      options:
        - Split-Tunnel
        - Full-Tunnel
        - Full-Tunnel (without VPN icon)
    validations:
      required: false

  - type: textarea
    id: advanced
    attributes:
      label: Low-level Settings
      description: Let us know if you have made any changes to the low-level settings.
      placeholder: 
      value: |
        Bootstrap server: 
        Fallback server: 
        Blocking mode, etc: 
    validations:
      required: false

  - type: input
    id: customer_id
    attributes:
      label: Support Ticket ID
      description: If you've already sent us a diagnostic report through the application, share the ticket ID number. You can find it in an auto-reply email from AdGuard support after sending a report.
      placeholder: Enter a ticket ID
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: Issue Details
      description: Please provide a set of steps to reproduce the issue.
      placeholder:
      value: |
        Steps to reproduce:
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: how_it_should_be
    attributes:
      label: Expected Behavior
      description:
      placeholder: A clear and concise description of what you expected to happen.
    validations:
      required: false
  
  - type: textarea
    id: how_it_is
    attributes:
      label: Actual Behavior
      placeholder: A clear description of what happened instead.
    validations:
      required: true

  - type: textarea
    id: screens
    attributes:
      label: Screenshots
      description: |
        If applicable, add screenshots explaining your problem.
        You can drag and drop images or paste them from clipboard.
        Use `<details> </details>` tag to hide screenshots under the spoiler.
      placeholder: If applicable, add screenshots explaining your problem.
      value: |
          <details><summary>Screenshot 1</summary>
          <!-- Paste screenshot below. -->
          
          
          
          </details>
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      placeholder: Add any other context about the problem here.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        Upvote [important issues](https://github.com/AdguardTeam/AdguardForiOS/issues?q=is%3Aissue+is%3Aopen+sort%3Areactions-%2B1-desc+) with a :+1:
